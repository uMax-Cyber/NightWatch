<text x="400" y="20" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">nightwatch.py</text>
<text x="15" y="55" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">$ ./scripts/nightwatch.py critical<animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="85" fill="#f38ba8" font-family="monospace" font-size="14" opacity="0">🛡🔴 ALERT (14:32)<animate attributeName="opacity" values="0;1" begin="1s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="1.5s" dur="1.5s" repeatCount="indefinite"/></text>
