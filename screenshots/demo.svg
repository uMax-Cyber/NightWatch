<text x="15" y="135" fill="#f38ba8" font-family="monospace" font-size="13" opacity="0">🔴 UniFi device 'AP-Floor3' OFFLINE<animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="2.9s" dur="1.5s" repeatCount="indefinite"/></text>
